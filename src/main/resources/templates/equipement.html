<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head th:replace="~{fragments/mise-en-page :: entete('Équipement')}"></head>
<body>
<header th:replace="~{fragments/mise-en-page :: barre('stations')}"></header>
<main class="corps">
    <h1><span th:text="${equipement.reference}">ASC-GC-01</span> · <span th:text="${equipement.libelle}">Ascenseur</span></h1>
    <p class="sous-titre">
        Station <span th:text="${equipement.station.nom}">Gare Centrale</span> ·
        Type <span th:text="${#strings.capitalize(#strings.toLowerCase(#strings.replace(equipement.type.name(), '_', ' ')))}">Ascenseur</span>
    </p>
    <div th:replace="~{fragments/mise-en-page :: messages}"></div>

    <div class="ligne">
        <section class="carte" style="max-width: 360px;">
            <h2>Informations</h2>
            <p class="sous-titre">État de fonctionnement</p>
            <p><span th:replace="~{fragments/mise-en-page :: pastille-etat(${equipement.etatFonctionnement})}"></span></p>
            <br>
            <a class="bouton bouton-rose" th:href="@{/equipements/{id}/incidents/nouveau(id=${equipement.id})}">Déclarer un incident</a>
            <br><br>
            <a th:href="@{/stations(stationId=${equipement.station.id})}">‹ Retour à la station</a>
        </section>

        <section class="carte">
            <h2>Incidents (du plus récent au plus ancien)</h2>
            <table th:if="${!incidents.isEmpty()}">
                <thead><tr><th>Ouvert le</th><th>Description</th><th>Statut</th><th></th></tr></thead>
                <tbody>
                <tr th:each="ligne : ${incidents}">
                    <td th:text="${#temporals.format(ligne.incident.dateHeureOuverture, 'dd/MM/yyyy HH:mm')}">01/11/2026 10:00</td>
                    <td th:text="${ligne.incident.description}">Panne</td>
                    <td><span th:replace="~{fragments/mise-en-page :: pastille-niveau(${ligne.niveau})}"></span></td>
                    <td><a th:href="@{/incidents/{id}(id=${ligne.incident.id})}">Détail ›</a></td>
                </tr>
                </tbody>
            </table>
            <p class="vide" th:if="${incidents.isEmpty()}">Aucun incident pour cet équipement.</p>
        </section>
    </div>
</main>
</body>
</html>
