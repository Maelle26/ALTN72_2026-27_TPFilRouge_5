<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head th:replace="~{fragments/mise-en-page :: entete('Déclarer un incident')}"></head>
<body>
<header th:replace="~{fragments/mise-en-page :: barre('stations')}"></header>
<main class="corps">
    <h1>Déclarer un incident</h1>
    <p class="sous-titre">Équipement : <span th:text="${equipement.reference}">ASC-GC-01</span> ·
        <span th:text="${equipement.libelle}">Ascenseur</span></p>
    <div th:replace="~{fragments/mise-en-page :: messages}"></div>

    <form class="carte" style="max-width: 720px;" method="post"
          th:action="@{/equipements/{id}/incidents(id=${equipement.id})}">
        <label class="champ">Description de l'incident
            <textarea name="description" maxlength="255" placeholder="Décrivez la panne observée…" required></textarea>
        </label>
        <div class="actions">
            <button class="bouton bouton-turquoise" type="submit">Enregistrer l'incident</button>
            <a class="bouton bouton-gris" th:href="@{/equipements/{id}(id=${equipement.id})}">Annuler</a>
        </div>
    </form>
</main>
</body>
</html>
