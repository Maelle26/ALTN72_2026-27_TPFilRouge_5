<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head th:replace="~{fragments/mise-en-page :: entete('Historique')}"></head>
<body>
<header th:replace="~{fragments/mise-en-page :: barre('historique')}"></header>
<main class="corps">
    <h1>Historique des incidents résolus</h1>
    <p class="sous-titre">Du plus récent au plus ancien (date de résolution)</p>
    <div th:replace="~{fragments/mise-en-page :: messages}"></div>

    <section class="carte">
        <table th:if="${!incidents.isEmpty()}">
            <thead><tr><th>Résolu le</th><th>Station</th><th>Équipement</th><th>Prestataire</th><th>Note</th><th></th></tr></thead>
            <tbody>
            <tr th:each="incident : ${incidents}">
                <td th:text="${#temporals.format(incident.dateHeureResolution, 'dd/MM/yyyy HH:mm')}">02/11/2026 09:00</td>
                <td th:text="${incident.equipement.station.nom}">Gare Centrale</td>
                <td th:text="${incident.equipement.reference}">ASC-GC-01</td>
                <td th:text="${incident.prestataire != null} ? ${incident.prestataire.nom} : '—'">Elevatec</td>
                <td><span class="etoiles" th:if="${incident.evaluation != null}" th:text="${incident.evaluation.note} + ' / 5'">4 / 5</span>
                    <span class="vide" th:if="${incident.evaluation == null}">Non évalué</span></td>
                <td><a th:href="@{/incidents/{id}(id=${incident.id})}">Détail ›</a></td>
            </tr>
            </tbody>
        </table>
        <p class="vide" th:if="${incidents.isEmpty()}">Aucun incident résolu pour le moment.</p>
    </section>

    <section class="carte" style="max-width: 460px;">
        <h2>Note moyenne des prestataires</h2>
        <table>
            <tbody>
            <tr th:each="note : ${notes}">
                <td th:text="${note.nomPrestataire}">Elevatec</td>
                <td><strong th:if="${note.moyenne != null}" th:text="${#numbers.formatDecimal(note.moyenne, 1, 1)} + ' / 5'">4,0 / 5</strong>
                    <span class="vide" th:if="${note.moyenne == null}">—</span></td>
            </tr>
            </tbody>
        </table>
    </section>
</main>
</body>
</html>
